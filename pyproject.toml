[project]
name = "document-analyzer"
version = "0.1.0"
description = ""
authors = [{ name = "Kevin Meinon", email = "kevin@meinon.de" }]
readme = "README.md"
requires-python = ">=3.14"

keywords = ["python3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Typing :: Typed",
]

dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "python-multipart",
    "jinja2",
    "pydantic-settings",
    # Document parsing
    "pdfreader",
    "pypdfium2",
    "rapidocr-onnxruntime",
    "python-docx",
    # AI/ML
    "openai",
    "chromadb",
    # Utilities
    "niquests",
    "rich",
    "loguru",
    "sqlmodel>=0.0.37",
    "pydantic-ai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "python-dotenv",
    "ty",
    "playwright>=1.57.0",
]

[project.urls]
Homepage = "https://pypi.org/ai-document-analyzer/ai-document-analyzer/"
Repository = "https://github.com/krytos/ai-document-analyzer"
Documentation = "https://github.com/krytos/ai-document-analyzer/tree/main/docs"

[project.scripts]
ai-document-analyzer = "document_analyzer.main:main"
creatte-dummies = "document_analyzer.services.library_service:create_dummy_library_items"

[build-system]
requires = ["uv-build>=0.12.3"]
build-backend = "uv_build"

[tool.uv]
link-mode = "hardlink"
compile-bytecode = true
package = true

[tool.fastapi]
entrypoint = "document_analyzer.main:app"

[tool.ruff]
line-length = 120
indent-width = 4
show-fixes = true
fix = true
exclude = ["migrations"]
target-version = "py314"
unsafe-fixes = true
src = ["src"]


[tool.ruff.lint]
extend-safe-fixes = ["E721", "E712", "F811"]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["SIM116", "E501"]
exclude = ["docs"]

[tool.ruff.lint.per-file-ignores]
# https://beta.ruff.rs/docs/rules/
"__init__.py" = ["F401", "F403", "F405"]
"tests/*" = ["ANN", "ARG", "INP001", "S101"]
"logger.py" = ["N815"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.analyze]
detect-string-imports = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["docs", "tests/**", "**/test_*.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
--doctest-modules \
--cov=./ \
--cov-append \
--cov-report html:tests/reports/coverage-html \
--cov-report xml:tests/reports/coverage.xml \
--ignore=docs/
"""
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = ["pragma: not covered", "@overload"]

[tool.coverage.run]
branch = true
relative_files = true
omit = [".tox/*", "tests/*"]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.16"]
env_list = ["py313", "lint", "type"]

[tool.tox.env_run_base]
description = "Run test suite"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
package = "wheel"
pass_env = [
    "GITHUB_*",
    "CI",
    "POE_OPULENCE_*",
]
commands = [
    ["pytest"],
    ["coverage", "report"],
]

[tool.tox.env.py313]
description = "Run tests on Python 3.14"
base_python = ["python3.14"]

[tool.tox.env.lint]
description = "Run Ruff linting and formatting checks"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
package = "skip"
commands = [
    ["ruff", "check", "src", "tests"],
    ["ruff", "format", "--check", "src", "tests"],
]

[tool.tox.env.type]
description = "Run ty type checking"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
package = "skip"
commands = [
    ["ty", "check"],
]
