services:
  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
      CHROMA_PATH: /data/chroma
      UPLOAD_DIR: /data/uploads
      LOG_FILE: /data/logs/app.log
    ports:
      - "8000:8000"
    volumes:
      - document_data:/data
    restart: unless-stopped

  development:
    profiles:
      - dev
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
      CHROMA_PATH: /data/chroma
      UPLOAD_DIR: /data/uploads
      LOG_FILE: /data/logs/app.log
    ports:
      - "8001:8000"
    volumes:
      - document_data:/data
      - ./src:/app/src:ro
    command: ["uvicorn", "document_analyzer.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  document_data:
