{% extends "base.html" %}
{% block title %}Upload a document | Clarity{% endblock %}
{% block content %}
<section class="flex min-h-[calc(100vh-137px)] items-center justify-center">
    <div class="w-full max-w-2xl text-center">
        <p class="mb-4 text-sm font-semibold uppercase tracking-[0.25em] text-indigo-400">Document intelligence</p>
        <h1 class="text-4xl font-semibold tracking-tight text-white sm:text-6xl">Understand every document.</h1>
        <p class="mx-auto mt-5 max-w-xl text-lg leading-8 text-slate-400">
            Upload a file and get a grounded summary, searchable context, and a conversational workspace.
        </p>
        <form id="upload-form" class="mt-10 rounded-2xl border border-dashed border-slate-700 bg-slate-900/70 p-8 text-left shadow-2xl shadow-black/20"
              hx-post="{{ url_for('upload_document') }}" hx-target="#upload-feedback" hx-swap="innerHTML"
              hx-encoding="multipart/form-data">
            <label for="document-file" class="block cursor-pointer rounded-xl border border-slate-800 bg-slate-950 p-8 text-center transition hover:border-indigo-500">
                <span class="text-4xl">↑</span>
                <span class="mt-3 block font-medium text-white">Choose a document to analyze</span>
                <span class="mt-2 block text-sm text-slate-400">PDF, DOCX, DOC, TXT, or Markdown · up to 50 MB</span>
                <span id="selected-file" class="mt-4 block text-sm text-indigo-300"></span>
                <input id="document-file" class="sr-only" type="file" name="file" accept=".pdf,.docx,.doc,.txt,.md" required
                       onchange="document.getElementById('selected-file').textContent = this.files[0]?.name || ''">
            </label>
            <button class="mt-6 w-full rounded-xl bg-indigo-500 px-4 py-3 font-semibold text-white transition hover:bg-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-900"
                    type="submit">Analyze document</button>
            <div id="upload-feedback" class="mt-4" aria-live="polite"></div>
        </form>
    </div>
</section>
{% endblock %}
