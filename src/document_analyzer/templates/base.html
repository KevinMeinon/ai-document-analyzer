<!doctype html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Document Analyzer{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="min-h-full bg-slate-950 text-slate-100 antialiased">
<header class="border-b border-slate-800 bg-slate-950/90">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="{{ url_for('dashboard') }}" class="text-lg font-semibold tracking-tight text-white">Clarity</a>
        <a href="{{ url_for('archive') }}"
           class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
            Archive
        </a>
    </nav>
</header>
<main class="mx-auto min-h-[calc(100vh-73px)] max-w-7xl px-6 py-8">
    {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
