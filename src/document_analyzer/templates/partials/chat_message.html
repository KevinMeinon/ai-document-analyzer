{% if is_error %}
<div class="rounded-xl bg-rose-950/50 p-4 text-sm leading-6 text-rose-200">{{ error }}</div>
{% else %}
<div class="rounded-xl bg-slate-800 p-4 text-sm leading-6 text-slate-300">
    <p>{{ answer }}</p>
    {% if sources %}<p class="mt-3 text-xs text-slate-500">Sources: {{ sources|join(', ') }}</p>{% endif %}
</div>
{% endif %}
